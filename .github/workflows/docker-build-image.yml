name: docker-build-image

on:
  push:
    branches:
      - 'main'
      - 'review'
    tags:
      - "*"
  pull_request:
    branches:
      - 'main'
      - 'review'

env:
  CACHE_IMAGE: ghcr.io/un-fao/calipseo-shiny-cache
  DOCKER_BUILDKIT: 1
  RENV_PATHS_ROOT: ~/.cache/R/renv

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: 'review'
    permissions:
      id-token: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/un-fao/calipseo-shiny
          flavor: latest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            
      - name: Login to image repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN_CALIPSEO }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: image=moby/buildkit:master,network=host

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        run: |
          docker buildx build \
            --cache-from type=registry,ref=$CACHE_IMAGE:latest \
            --cache-to type=registry,ref=$CACHE_IMAGE:latest,mode=max \
            --tag ghcr.io/un-fao/calipseo-shiny:latest \
            --build-arg RENV_PATHS_ROOT=${{ env.RENV_PATHS_ROOT }} \
            --output type=docker,dest=/tmp/docker-image.tar \
            .

      - name: Load Docker image
        if: github.ref == 'refs/heads/review' || github.ref_type == 'tag'
        run: |
          docker load -i /tmp/docker-image.tar

      - name: Conditional push Docker image
        if: github.ref == 'refs/heads/review' || github.ref_type == 'tag'
        run: |
          TAG_NAME="${GITHUB_REF##*/}"
          IMAGE="ghcr.io/un-fao/calipseo-shiny"

          if [ "${GITHUB_REF}" = "refs/heads/review" ]; then
            docker tag "${IMAGE}:latest" "${IMAGE}:review"
            docker push "${IMAGE}:review"
          else
            docker tag "${IMAGE}:latest" "${IMAGE}:${TAG_NAME}"
            docker push "${IMAGE}:latest"
            docker push "${IMAGE}:${TAG_NAME}"
          fi
          
      - name: Authenticate to Google Cloud
        if: github.ref == 'refs/heads/review'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: github.ref == 'refs/heads/review'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.PROJECT_ID }}
          
      - name: Update Review Docker image
        if: github.ref == 'refs/heads/review'
        run: |
          gcloud compute ssh "${{ vars.VM_NAME }}" \
            --zone="${{ vars.ZONE }}" \
            --tunnel-through-iap --quiet \
            --command "docker pull ghcr.io/un-fao/calipseo-shiny:review"
      
      - name: Restart Review ShinyProxy
        if: github.ref == 'refs/heads/review'
        run: |
          gcloud compute ssh "${{ vars.VM_NAME }}" \
            --zone="${{ vars.ZONE }}" \
            --tunnel-through-iap --quiet \
            --command "sudo systemctl restart shinyproxy"
        
      - name: Health check
        if: github.ref == 'refs/heads/review'
        run: |
          # Fail the run if the application does not answer within 3 minutes of the restart
          gcloud compute ssh "${{ vars.VM_NAME }}" \
            --zone="${{ vars.ZONE }}" \
            --tunnel-through-iap --quiet \
            --command "for i in \$(seq 1 36); do \
                if curl -sf -o /dev/null http://localhost:8484/shinyproxy/login; then echo 'Calipseo Shiny Proxy is up'; exit 0; fi; \
                sleep 5; \
              done; \
              echo 'Calipseo Shiny Proxy did not start, last errors:'; \
              sudo journalctl -u shinyproxy -p err -n 1 --no-pager;\
              exit 1"

      - name: Wait for load balancer
        if: github.ref == 'refs/heads/review'
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # The load balancer keeps answering 503 until its own health checks see the restarted app:
          # only report the deployment as done once the public URL serves the login page
          if [ -z "$APP_URL" ]; then
            echo "::notice::APP_URL is not set for this environment, skipping the public URL check"
            exit 0
          fi
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${APP_URL%/}/shinyproxy/login" || true)
            if [ "$code" = "200" ]; then echo "${APP_URL} is serving after $((i * 5)) s"; exit 0; fi
            echo "HTTP ${code}, waiting..."
            sleep 5
          done
          echo "${APP_URL} still not serving 2 minutes after the application started"
          exit 1       